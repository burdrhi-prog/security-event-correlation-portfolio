name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic investigation report
        run: python scripts/investigation_report.py examples/synthetic_sim_auth_events.csv --output /tmp/investigation_report.md
      - name: Check synthetic evidence quality
        run: python scripts/evidence_quality.py examples/synthetic_sim_auth_events.csv --output /tmp/evidence_quality.json
